plugins {
    id 'com.android.application'
}

android {
    namespace 'com.external.amongusmod'
    compileSdk 34

    defaultConfig {
        applicationId "com.external.amongusmod"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "4.0-VIP"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.core:core:1.12.0'
}
